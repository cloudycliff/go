# KataGo analysis engine config for go-review.
# Paths are relative to the go-review folder (the engine runs there).

logDir = logs/katago

# All values in responses (winrate, scoreLead, ownership) are from Black's side.
reportAnalysisWinratesAs = BLACK

analysisPVLen = 15
maxVisits = 400

# Whole-game analysis sends many positions at once, so search several in parallel.
numAnalysisThreads = 8
numSearchThreadsPerAnalysisThread = 4
nnMaxBatchSize = 64

nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
