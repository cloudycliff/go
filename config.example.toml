# Copy to config.toml and edit. Relative paths are resolved against this folder.

[student]
fox_nickname = "your-fox-nickname"
age = 10

[katago]
exe = 'C:\src\go\LizzieYzy Next NVIDIA\app\engines\katago\windows-x64\katago.exe'
model = 'C:\src\go\LizzieYzy Next NVIDIA\app\weights\default.bin.gz'
human_model = 'models/b18c384nbt-humanv0.bin.gz'
config = 'katago/analysis.cfg'

[analysis]
# Visits per position for the whole-game pass.
overview_visits = 400
# Visits for the deep pass on key positions (used from M2 on).
deep_visits = 3000
# How many HumanSL levels above the student the "peer" recommendation uses.
peer_steps = 2

[llm]
# "AI 老师说" explanations. Any OpenAI-compatible chat API; DeepSeek by default.
# The API key is NEVER written here: set it as an environment variable named by api_key_env,
# e.g. in PowerShell:  [Environment]::SetEnvironmentVariable("DEEPSEEK_API_KEY", "<key>", "User")
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
enabled = true
# DeepSeek thinks (effort high) by default; retelling facts does not need it, and the thinking
# can use up the output budget. "enabled" / "disabled" / "" for the provider's default.
thinking = "disabled"
